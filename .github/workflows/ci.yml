name: CI (manual fallback)

# GitHub Actionsin automaattiset ajot on väliaikaisesti poistettu käytöstä
# GitHub-tilin laskutus-/runner-ongelman vuoksi. Tätä workflowta ei saa
# tulkita hyväksyntäportiksi ennen kuin Actions toimii jälleen normaalisti.
# Väliaikainen hyväksyntämalli: docs/EXTERNAL_CI_WORKAROUND.md
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: lint-typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_EDGE_FUNCTION_NAME: submit-quote
      VITE_PREVIEW_ADMIN_EMAIL: ville@vidosocial.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify

  e2e-ui:
    name: playwright-ui-smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_EDGE_FUNCTION_NAME: submit-quote
      VITE_PREVIEW_ADMIN_EMAIL: ville@vidosocial.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
